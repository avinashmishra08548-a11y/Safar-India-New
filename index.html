    <!-- Android 11+ WebView UPI Intent Enabler (Runs before Razorpay checkout.js initializes) -->
    <script>
      (function () {
        try {
          var ua = window.navigator && window.navigator.userAgent ? window.navigator.userAgent : '';
          if (/Android/i.test(ua) && (/;\s*wv\b/i.test(ua) || /\bwv\)/i.test(ua) || /Version\/\d+\.\d+/i.test(ua))) {
            var cleanUa = ua
              .replace(/;\s*wv\)/gi, ')')
              .replace(/;\s*wv;/gi, ';')
              .replace(/\bwv\b/gi, '')
              .replace(/Version\/\d+\.\d+\s*/gi, '');
            Object.defineProperty(window.navigator, 'userAgent', {
              get: function () { return cleanUa; },
              configurable: true
            });
            Object.defineProperty(window.navigator, 'appVersion', {
              get: function () { return cleanUa.replace(/^Mozilla\//i, ''); },
              configurable: true
            });
            window.__SAFAR_ANDROID_WEBVIEW__ = true;
          }
        } catch (e) {}
      })();
    </script>
